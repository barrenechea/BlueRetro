name: pytest
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Cache build and ccache
      uses: actions/cache@v6
      with:
        # build/ is a plain ninja tree and the container gives the workspace
        # and toolchain the same paths every run, so it is safe to restore.
        path: |
          build
          /root/.cache/ccache
        key: idf6.1-qemu-${{ runner.os }}-${{ hashFiles('configs/dbg/qemu', 'main/**', 'components/**', 'CMakeLists.txt', 'sdkconfig.defaults*') }}
        restore-keys: |
          idf6.1-qemu-${{ runner.os }}-
    - name: Setup test dependencies
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        # The container runs as root but the workspace is owned by the
        # runner user, so git refuses the repo as "dubious ownership".
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        # numpy is needed by tests/device_data.
        # Pin the pytest major: 9.x renamed -junitxml to --junit-xml, so an
        # unbounded install can break the flag below on a new major.
        pip install "pytest>=9,<10" gcovr websocket-client numpy
    - name: Build with ESP-IDF
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        echo "br_version=$(git describe --always --tags --dirty)" >> $GITHUB_ENV
        echo "$(git describe --always --tags --dirty) dbg qemu" | cut -c -31 > version.txt
        cat version.txt
        cp configs/dbg/qemu sdkconfig
        # ccache is off by default in IDF 6.1.
        idf.py --ccache build
        ccache -s
    - name: Run pytest
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        (cd build; esptool --chip esp32 merge-bin --pad-to-size 4MB -o flash_image.bin @flash_args)
        qemu-system-xtensa -machine esp32 -drive file=build/flash_image.bin,if=mtd,format=raw -serial file:serial_log.txt -serial file:gcov_data.gcfn -display none -nic user,model=open_eth,id=lo0,hostfwd=tcp:127.0.0.1:8001-:80 -daemonize
        pytest --junit-xml=pytest_results.xml
    - name: Generate gcov report
      if: always()
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        # The cached build/ carries .gcda from the previous run, which no
        # longer match rebuilt objects and make gcov reject them.
        find build -name '*.gcda' -delete
        xtensa-esp32-elf-gcov-tool merge-stream gcov_data.gcfn
        gcovr --gcov-executable xtensa-esp32-elf-gcov --html-details coverage.html --print-summary > coverage_summary.txt
        cat coverage_summary.txt
    - name: Publish test summary
      if: always()
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        python tests/summarize_results.py
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs
        path: |
          serial_log.txt
          coverage*
          pytest_results.xml
        if-no-files-found: ignore
